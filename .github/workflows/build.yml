name: Build Nintendo Switch NRO

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Switch dependencies
        run: |
          dkp-pacman -S --needed --noconfirm \
            switch-sdl2 \
            switch-sdl2_mixer \
            switch-sdl2_ttf \
            switch-sdl2_image \
            switch-sdl2_gfx \
            switch-curl \
            switch-mbedtls \
            switch-mpg123 \
            switch-flac \
            switch-libvorbisidec \
            switch-opusfile \
            switch-freetype \
            switch-libpng \
            switch-libjpeg-turbo || true

      - name: Build project
        run: make

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: yandex-music-switch
          path: yandex-music.nro
          if-no-files-found: error
